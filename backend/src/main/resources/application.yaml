spring:
  datasource:
    url: jdbc:mysql://localhost:3306/musicmatch
    username: musicuser
    password: musicpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  address: 0.0.0.0