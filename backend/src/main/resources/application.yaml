spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/musicmatch}
    username: ${DB_USER:musicuser}
    password: ${DB_PASS:musicpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  hikari:
    initializationFailTimeout: 60000

server:
  port: 8080
  address: 0.0.0.0