name: Full CI/CD Pipeline

on:
  push:
    branches:
      - release

jobs:

  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: |
          cd backend
          mvn test


  backend:
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          cd backend
          docker build -t musicmatch-backend .

      - name: Save image
        run: docker save musicmatch-backend > backend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend-image.tar


  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          cd mobile
          chmod +x gradlew
          ./gradlew assembleRelease
          
      - name: List files for debugging
        run: find mobile -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/app/build/outputs/apk/release/app-release.apk


  release:
    needs: [backend, android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Create version
        run: echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: |
            backend-image.tar
            app-release.apk
            infrastructure/docker-compose.yml