name: Full CI/CD Pipeline

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:

  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: |
          cd backend
          mvn test


  backend:
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          cd backend
          docker build -t musicmatch-backend .

      - name: Save image
        run: docker save musicmatch-backend > backend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend-image.tar


  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          cd mobile
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: List files for debugging
        run: find mobile -name "*.apk"

      - name: Rename APK
        run: mv mobile/app/build/outputs/apk/debug/app-debug.apk mobile/app/build/outputs/apk/debug/MusicMatch-oficial.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/app/build/outputs/apk/debug/MusicMatch-oficial.apk


  release:
      needs: [backend, android]
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v3

        - uses: actions/download-artifact@v4
          with:
            name: backend
            path: .

        - uses: actions/download-artifact@v4
          with:
            name: apk
            path: .

        - name: Create version
          run: echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

        - name: Prepare and Zip Files
          run: |
            mkdir MusicMatch-Full-Pack
            # Copiamos la imagen docker y el apk
            mv backend-image.tar MusicMatch-Full-Pack/
            mv MusicMatch-oficial.apk MusicMatch-Full-Pack/
            # Copiamos la infraestructura (manteniendo la estructura de carpetas)
            cp -r infrastructure MusicMatch-Full-Pack/
            #Copiamos README con manual de instalación
            cp README.md MusicMatch-Full-Pack/
            # Comprimimos la carpeta
            zip -r MusicMatch-Project-${{ env.VERSION }}.zip MusicMatch-Full-Pack/

        - name: Release
          uses: softprops/action-gh-release@v1
          with:
            tag_name: ${{ env.VERSION }}
            name: Release ${{ env.VERSION }}
            files: |
              MusicMatch-Project-${{ env.VERSION }}.zip
              